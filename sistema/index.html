<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sheik Adega — Sistema de Gestão</title>
<link rel="icon" href="logo.webp">
<style>
:root{--or:#F5A02A;--br:#7A4A22;--gr:#14783C;--rd:#B3261E;--bg:#F5F2EC;--tx:#1A1A1A;--mu:#55504A;--ln:#D9D3C8;--cd:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0 0 10px;line-height:1.2}
h1{font-size:24px}h2{font-size:20px}h3{font-size:17px}
p{margin:0 0 10px}
a{color:var(--br)}
:focus-visible{outline:3px solid #1565C0;outline-offset:2px}
.hd{position:sticky;top:0;z-index:20;background:#000;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:60px}
.hd img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
.hd b{font-size:19px;display:block;line-height:1.1}
.hd small{color:#F5A02A;font-size:14px;font-weight:600}
.hd .dt{margin-left:auto;font-size:14px;color:#ddd;text-align:right}
.demo{background:#FFF1D6;color:#5A3A12;font-size:13.5px;text-align:center;padding:5px 10px;border-bottom:1px solid #EBD3A2}
main{padding:14px 14px 150px;max-width:1180px;margin:0 auto}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;border-left:6px solid var(--or)}
.kpi span{display:block;font-size:14.5px;color:var(--mu);font-weight:600}
.kpi b{display:block;font-size:clamp(19px,5.7vw,25px);line-height:1.15;margin:2px 0;white-space:nowrap}
.kpi small{color:var(--mu);font-size:13.5px}
.kpi.g{border-left-color:var(--gr)}.kpi.g b,.g-t{color:var(--gr)}
.kpi.r{border-left-color:var(--rd)}.kpi.r b,.r-t{color:var(--rd)}
.kpi.k{border-left-color:#000}
.mut{color:var(--mu)}
.sm{font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid #C77E12;background:var(--or);color:#1A1A1A;font-weight:700;text-decoration:none;font-size:17px}
.btn.g{background:var(--gr);border-color:var(--gr);color:#fff}
.btn.r{background:var(--rd);border-color:var(--rd);color:#fff}
.btn.o{background:#fff;border-color:var(--br);color:var(--br)}
.btn.k{background:#111;border-color:#111;color:#fff}
.btn.big{min-height:58px;font-size:20px;width:100%}
.btn.s{min-height:44px;padding:6px 12px;font-size:15.5px}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--ln);background:#fff;font-weight:600;white-space:nowrap}
.chip.on{background:var(--or);border-color:var(--br);color:#1A1A1A}
.inp,select.inp,textarea.inp{width:100%;min-height:50px;padding:10px 12px;border:2px solid #8C857A;border-radius:10px;background:#fff;font-size:17px}
label.f{display:block;font-weight:600;margin-bottom:12px;font-size:15.5px}
label.f .inp{margin-top:4px;font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #EBE6DC}
.li:last-child{border-bottom:0}
.li .gw{flex:1;min-width:0}
.li .gw b{display:block}
.li .gw small{color:var(--mu);font-size:14px}
.li .vl{font-weight:700;white-space:nowrap;text-align:right}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700;background:#EFE9DD;color:#4A3A22;vertical-align:middle}
.tag.r{background:#FBE3E0;color:#8E1B14}.tag.g{background:#DDF1E3;color:#0E5C2C}.tag.o{background:#FFE7BF;color:#6A4208}.tag.b{background:#DCEBFA;color:#0D4A85}
.bar{height:10px;background:#EFE9DD;border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--or);border-radius:6px}
.bar i.g{background:var(--gr)}.bar i.b{background:#1E78C8}
.alert{border-left:6px solid var(--rd)}
.leg{display:flex;gap:16px;font-size:14.5px;margin-bottom:6px;font-weight:600}
.leg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:5px;vertical-align:-2px}
#chart{width:100%;overflow:hidden}
#chart text{font-family:inherit;fill:#1A1A1A}
/* PDV */
.pdv{display:block}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:10px}
.tile{position:relative;text-align:left;background:#fff;border:2px solid var(--ln);border-radius:14px;padding:12px 10px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.tile b{font-size:15.5px;line-height:1.2}
.tile .tp{font-size:19px;font-weight:800;color:var(--br)}
.tile small{color:var(--mu);font-size:13px}
.tile.off{opacity:.55}
.tile .bdg{position:absolute;top:-8px;right:-6px;background:var(--gr);color:#fff;font-style:normal;font-weight:800;min-width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0 7px;font-size:15px}
.tile.in{border-color:var(--gr)}
.qb{width:44px;height:44px;border-radius:10px;border:2px solid var(--br);background:#fff;font-size:22px;font-weight:800;color:var(--br);line-height:1;flex:none}
.qn{min-width:34px;text-align:center;font-weight:800;font-size:19px}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:22px;padding:12px 0;border-top:2px solid #1A1A1A;margin-top:6px}
.tot b{font-size:28px}
.cartbar{position:fixed;left:10px;right:10px;bottom:76px;z-index:15;display:none}
.cartbar.on{display:flex}
/* estoque */
.prow{padding:12px 0;border-bottom:1px solid #EBE6DC}
.prow:last-child{border-bottom:0}
.prow .st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin:8px 0}
.prow .st div{font-size:13.5px;color:var(--mu)}
.prow .st b{display:block;font-size:16.5px;color:var(--tx)}
.kan{display:grid;gap:12px}
.kcol{background:#EDE8DE;border-radius:14px;padding:10px}
.kcol h3{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.kcard{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:8px}
.kcard .row{margin-top:10px}
.vas{display:grid;grid-template-columns:1fr;gap:10px}
.vas .kpi b{font-size:34px}
table.t{width:100%;border-collapse:collapse;font-size:15.5px}
table.t th{text-align:left;font-size:13.5px;color:var(--mu);padding:6px 6px;border-bottom:2px solid var(--ln)}
table.t td{padding:9px 6px;border-bottom:1px solid #EBE6DC;vertical-align:top}
table.t .n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.dre .li{font-size:17.5px}
.dre .li.t{border-top:2px solid #1A1A1A;border-bottom:0;font-size:20px;font-weight:800}
details summary{cursor:pointer;list-style:none;min-height:44px}
details summary::-webkit-details-marker{display:none}
/* nav */
.bn{position:fixed;left:0;right:0;bottom:0;z-index:18;background:#fff;border-top:2px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bn button{flex:1;background:none;border:0;border-top:4px solid transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:#4A453E;padding:4px 2px}
.bn button.on{color:var(--br);border-top-color:var(--or);background:#FFF6E6}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sb{display:none}
/* modal */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.mod{background:#fff;width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 22px}
.mod .x{float:right;width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);background:#fff;font-size:22px;font-weight:700;margin:-6px -4px 0 8px}
.menu{display:grid;gap:10px}
.menu .btn{justify-content:flex-start;min-height:58px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:60;background:#111;color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast.g{background:var(--gr)}.toast.r{background:var(--rd)}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}.vas{grid-template-columns:repeat(3,1fr)}.prow .st{grid-template-columns:repeat(6,1fr)}}
@media(min-width:900px){
 body{padding-left:236px}
 .hd{margin-left:-236px;padding-left:20px}
 .bn,.cartbar,.cartbar.on{display:none}
 .sb{display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:60px;bottom:0;width:236px;background:#fff;border-right:1px solid var(--ln);padding:12px 10px;overflow:auto;z-index:10}
 .sb button{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 12px;border-radius:12px;border:0;background:none;font-weight:700;font-size:16.5px;text-align:left;color:#2A2622}
 .sb button:hover{background:#F4EEE2}
 .sb button.on{background:var(--or);color:#1A1A1A}
 .sb .rst{margin-top:auto;font-size:14px;font-weight:600;color:var(--mu);border:1px dashed #8C857A}
 main{padding:20px 24px 60px}
 .kpi b{font-size:clamp(20px,2.1vw,29px)}
 .pdv{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
 .pdv aside{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
 .kan{grid-template-columns:repeat(3,1fr);align-items:start}
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
 .ov{align-items:center}.mod{border-radius:18px}
 .toast{bottom:40px}
}
</style>
</head>
<body>
<header class="hd">
 <img src="logo.webp" alt="" onerror="this.style.display='none'">
 <div><b>Sheik Adega</b><small id="vt">Hoje</small></div>
 <div class="dt" id="hdt"></div>
</header>
<div class="demo">Demonstração — dados de exemplo</div>
<nav class="sb" id="sb" aria-label="Menu"></nav>
<main id="main"></main>
<button class="btn g big cartbar" id="cartbar" data-a="vercart"></button>
<nav class="bn" id="bn" aria-label="Menu"></nav>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>
<script>
'use strict';
var KEY='sheik_sistema_v1',SITE_KEY='sheik_pedidos_site',DAY=864e5,H=36e5;
var CATS=['Cerveja','Whisky/Destilados','Refrigerante','Água','Gelo','Carvão','Gás','Outros'];
var PAGS=['Dinheiro','Pix','Cartão débito','Cartão crédito','Fiado'];
var DESP=['Aluguel','Luz','Motoboy','Funcionário','Internet/Telefone','Outros','Retirada do dono'];
var MOTIVOS=['Quebrou','Venceu / estragou','Consumo próprio','Sumiu / furto','Erro na contagem'];
var FORA_LUCRO=['Compra de mercadoria','Retirada do dono'];
var VIEWS=[['hoje','Hoje','home'],['vender','Vender','cart'],['estoque','Estoque','box'],['entradas','Chegou mercadoria','truck'],['caixa','Caixa','wallet'],['agua','Água (entregas)','drop'],['fiado','Fiado','book'],['relatorios','Relatórios','chart']];
var ICONS={home:'M3 11l9-8 9 8M5 10v10h14V10',cart:'M3 4h2l2.5 11h10L20 7H6.5M9 20h.01M17 20h.01',box:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',truck:'M2 6h11v10H2zM13 9h4l4 4v3h-8M6.5 19h.01M17.5 19h.01',wallet:'M3 6h16v3M3 6v13h18V9H3M16 14h2',drop:'M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z',book:'M6 3h12v18H6zM9 8h6M9 12h6M9 16h4',chart:'M4 20V10M10 20V4M16 20v-7M21 20H3',more:'M5 12h.01M12 12h.01M19 12h.01'};
var S,ui={view:'hoje',cat:'Todos',busca:'',cart:[],pag:'Pix',fiNome:'',fiTel:'',recebido:'',estFiltro:'todos',estBusca:'',cxPer:'hoje',relPer:'30d',de:'',ate:'',cxLim:40,aguaTab:'pedidos',nota:[],forn:''};

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s)}
function p2(n){return (n<10?'0':'')+n}
function R(v){return (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function N(v,d){d=d||0;return (+v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})}
function pct(v){return N(v,1)+'%'}
function dm(d){d=new Date(d);return p2(d.getDate())+'/'+p2(d.getMonth()+1)}
function hm(d){d=new Date(d);return p2(d.getHours())+':'+p2(d.getMinutes())}
function num(v){v=String(v==null?'':v).replace(/[^\d.,-]/g,'');if(v.indexOf(',')>=0)v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0}
function r2(v){return Math.round(v*100)/100}
function sod(d){d=new Date(d);d.setHours(0,0,0,0);return d.getTime()}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function sum(a,k){return r2(a.reduce(function(s,x){return s+(+x[k]||0)},0))}
function dias(d){return Math.floor((sod(Date.now())-sod(d))/DAY)}
function ha(d){var n=dias(d);return n<=0?'hoje':n===1?'ontem':'há '+n+' dias'}
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"'+(n==='more'?' style="stroke-width:3.5"':'')+'><path d="'+ICONS[n]+'"/></svg>'}
function prod(id){for(var i=0;i<S.produtos.length;i++)if(S.produtos[i].id===id)return S.produtos[i];return null}
function val(id){var e=document.getElementById(id);return e?e.value:''}
function money(v){return N(v,2)}
function waLink(tel,msg){var d=String(tel||'').replace(/\D/g,'');if(d&&!(d.indexOf('55')===0&&d.length>=12))d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg)}
function toast(m,c){var t=$('#toast');t.innerHTML='<div class="toast '+(c||'')+'">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){t.innerHTML=''},2600)}
function save(){S.mexido=true;persist()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function opts(list,sel){return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}

/* ---------- regras de negócio ---------- */
function mkVenda(itens,pag,data,extra){
  var its=itens.map(function(i){var p=i.pid?prod(i.pid):null;
    return {pid:p?p.id:null,nome:p?p.nome:i.nome,cat:p?p.cat:(i.cat||'Outros'),qtd:i.qtd,preco:r2(i.preco!=null?i.preco:p.preco),custo:r2(p?p.custo:0)}});
  var v={id:uid('v'),data:data||Date.now(),itens:its,pag:pag,origem:'balcao',
    total:r2(its.reduce(function(s,i){return s+i.preco*i.qtd},0)),
    custo:r2(its.reduce(function(s,i){return s+i.custo*i.qtd},0))};
  if(extra)for(var k in extra)v[k]=extra[k];
  return v}
function registrarVenda(itens,pag,extra){
  var v=mkVenda(itens,pag,Date.now(),extra);
  v.itens.forEach(function(i){var p=i.pid&&prod(i.pid);if(p)p.qtd=r2(p.qtd-i.qtd)});
  S.vendas.push(v);
  if(pag==='Fiado')S.fiados.push({id:uid('f'),data:v.data,cliente:v.cliente||'Cliente',whats:v.whats||'',valor:v.total,vendaId:v.id,desc:resumo(v),pago:false});
  save();return v}
function novoCustoMedio(p,qtd,custo){var q=Math.max(0,p.qtd);return q+qtd>0?r2((q*p.custo+qtd*custo)/(q+qtd)):r2(custo)}
function registrarCompra(forn,itens,pag){
  var its=itens.map(function(i){var p=prod(i.pid);p.custo=novoCustoMedio(p,i.qtd,i.custo);p.qtd=r2(p.qtd+i.qtd);return {pid:p.id,nome:p.nome,qtd:i.qtd,custo:r2(i.custo)}});
  var tot=r2(its.reduce(function(s,i){return s+i.qtd*i.custo},0)),c={id:uid('c'),data:Date.now(),fornecedor:forn,itens:its,total:tot,pag:pag};
  S.compras.push(c);
  S.caixa.push({id:uid('m'),data:c.data,tipo:'out',cat:'Compra de mercadoria',desc:forn,valor:tot,pag:pag});
  save();return c}
function resumo(v){return v.itens.map(function(i){return N(i.qtd)+'x '+i.nome}).join(', ')}
function movs(){var m=[];
  S.vendas.forEach(function(v){if(v.pag!=='Fiado')m.push({data:v.data,tipo:'in',cat:v.origem==='agua'?'Entrega de água':'Venda',desc:resumo(v),valor:v.total,pag:v.pag})});
  S.caixa.forEach(function(c){m.push(c)});
  return m.sort(function(a,b){return b.data-a.data})}
function saldoGeral(){return r2(movs().reduce(function(s,m){return s+(m.tipo==='in'?m.valor:-m.valor)},0))}
function periodo(k){var t=sod(Date.now());
  if(k==='hoje')return [t,t+DAY];
  if(k==='7d')return [t-6*DAY,t+DAY];
  if(k==='custom'){var a=ui.de?new Date(ui.de+'T00:00').getTime():t-29*DAY,b=ui.ate?new Date(ui.ate+'T00:00').getTime():t;if(b<a){var x=a;a=b;b=x}return [a,b+DAY]}
  return [t-29*DAY,t+DAY]}
function noPer(l,pr){return l.filter(function(x){return x.data>=pr[0]&&x.data<pr[1]})}
function aggProd(vs){var m={};vs.forEach(function(v){v.itens.forEach(function(i){var a=m[i.nome]||(m[i.nome]={nome:i.nome,cat:i.cat,qtd:0,total:0,custo:0});a.qtd+=i.qtd;a.total+=i.preco*i.qtd;a.custo+=i.custo*i.qtd})});
  return Object.keys(m).map(function(k){var a=m[k];a.total=r2(a.total);a.custo=r2(a.custo);a.lucro=r2(a.total-a.custo);return a})}
function prodTag(t){for(var i=0;i<S.produtos.length;i++)if(S.produtos[i].tag===t)return S.produtos[i];return null}
function matchProd(i){if(i.pid&&prod(i.pid))return prod(i.pid);var n=norm(i.nome);
  for(var k=0;k<S.produtos.length;k++)if(norm(S.produtos[k].nome)===n)return S.produtos[k];
  if(/complet|vasilhame/.test(n))return prodTag('completo');
  if(/gal|20 ?l|recarga/.test(n))return prodTag('recarga');
  return null}
function normPag(p){p=norm(p);if(/pix/.test(p))return 'Pix';if(/deb/.test(p))return 'Cartão débito';if(/cred|cart/.test(p))return 'Cartão crédito';if(/fiado/.test(p))return 'Fiado';return 'Dinheiro'}
function normStatus(s){s=norm(s);if(/entregue|conclu|finaliz/.test(s))return 'entregue';if(/saiu|rota|caminho/.test(s))return 'saiu';return 'recebido'}
function parseData(d){if(typeof d==='number'&&isFinite(d))return d;var m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\D+(\d{1,2}):(\d{2}))?/.exec(String(d||''));
  if(m)return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||12),+(m[5]||0)).getTime();
  var t=new Date(d).getTime();return isFinite(t)?t:Date.now()}
function importarSite(){var arr;try{arr=JSON.parse(localStorage.getItem(SITE_KEY)||'[]')}catch(e){arr=[]}
  if(!Array.isArray(arr))return 0;var n=0;

/* ---------- RELATÓRIOS ---------- */
function relCalc(pr){var vs=noPer(S.vendas,pr),fat=sum(vs,'total'),cmv=sum(vs,'custo'),desp=sum(noPer(S.caixa,pr).filter(function(c){return c.tipo==='out'&&FORA_LUCRO.indexOf(c.cat)<0}),'valor'),perd=sum(noPer(S.ajustes,pr),'valor');
  var ag={fat:0,custo:0},ad={fat:0,custo:0};vs.forEach(function(v){v.itens.forEach(function(i){var o=i.cat==='Água'?ag:ad;o.fat+=i.preco*i.qtd;o.custo+=i.custo*i.qtd})});
  return {vs:vs,fat:fat,cmv:cmv,bruto:r2(fat-cmv),desp:desp,perd:perd,liq:r2(fat-cmv-desp-perd),agua:ag,adega:ad,rank:aggProd(vs).sort(function(a,b){return b.lucro-a.lucro})}}
function vRel(){var pr=periodo(ui.relPer),r=relCalc(pr),mg=r.fat?r.liq/r.fat*100:0,mb=r.fat?r.bruto/r.fat*100:0;
  var h=perChips('relPer')+'<p class="mut sm">Período: '+perTxt(pr)+' · '+r.vs.length+' vendas</p><div class="cols"><div class="card dre"><h2>Resultado</h2>'+
  '<div class="li"><div class="gw">Vendi (faturamento)</div><div class="vl">'+R(r.fat)+'</div></div>'+
  '<div class="li"><div class="gw">− Custo da mercadoria vendida</div><div class="vl r-t">'+R(r.cmv)+'</div></div>'+
  '<div class="li"><div class="gw"><b>= Lucro bruto</b><small>margem de '+pct(mb)+'</small></div><div class="vl">'+R(r.bruto)+'</div></div>'+
  '<div class="li"><div class="gw">− Despesas (contas pagas)</div><div class="vl r-t">'+R(r.desp)+'</div></div>'+
  '<div class="li"><div class="gw">− Perdas e quebras</div><div class="vl r-t">'+R(r.perd)+'</div></div>'+
  '<div class="li t"><div class="gw">= Lucro líquido (o que sobrou)</div><div class="vl '+(r.liq<0?'r-t':'g-t')+'">'+R(r.liq)+'</div></div>'+
  '<p class="sm" style="margin-top:6px">De cada R$ 100 vendidos, sobraram <b>'+R(mg)+'</b> (margem líquida de '+pct(mg)+').</p><p class="mut sm">Compra de mercadoria e retirada do dono não entram como despesa aqui.</p></div>';
  var tf=r.fat||1;h+='<div class="card"><h2>Adega x Água</h2>'+[['Adega (bebidas, gelo, carvão, gás)',r.adega,''],['Água (galões e garrafas)',r.agua,'b']].map(function(x){var f=r2(x[1].fat),l=r2(x[1].fat-x[1].custo);
    return '<div class="li"><div class="gw"><b>'+x[0]+'</b><small>vendeu '+R(f)+' ('+pct(f/tf*100)+') · margem '+pct(f?l/f*100:0)+'</small><div class="bar"><i class="'+x[2]+'" style="width:'+Math.round(f/tf*100)+'%"></i></div></div><div class="vl g-t">lucro<br>'+R(l)+'</div></div>'}).join('')+'</div></div>';
  h+='<div class="card"><h2>Produtos que mais dão lucro</h2><div class="scroll"><table class="t"><thead><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Vendeu</th><th class="n">Lucro</th><th class="n">Margem</th></tr></thead><tbody>'+
   (r.rank.length?r.rank.slice(0,12).map(function(a,i){return '<tr><td>'+(i+1)+'. '+esc(a.nome)+'</td><td class="n">'+N(a.qtd)+'</td><td class="n">'+R(a.total)+'</td><td class="n g-t"><b>'+R(a.lucro)+'</b></td><td class="n">'+pct(a.total?a.lucro/a.total*100:0)+'</td></tr>'}).join(''):'<tr><td colspan="5" class="mut">Sem vendas neste período.</td></tr>')+'</tbody></table></div></div>';
  return h+'<div class="row"><button class="btn" data-a="csv" data-v="vendas">Baixar vendas (planilha CSV)</button><button class="btn o" data-a="csv" data-v="produtos">Baixar resumo por produto (CSV)</button></div>'}
function csv(tipo){var pr=periodo(ui.relPer),r=relCalc(pr),rows,c=function(v){return N(v,2).replace(/\./g,'')};
  if(tipo==='vendas'){rows=[['Data','Hora','Produto','Categoria','Qtd','Preço','Total','Custo unit.','Lucro','Pagamento','Cliente','Origem']];
    r.vs.forEach(function(v){v.itens.forEach(function(i){rows.push([dm(v.data)+'/'+new Date(v.data).getFullYear(),hm(v.data),i.nome,i.cat,i.qtd,c(i.preco),c(i.preco*i.qtd),c(i.custo),c((i.preco-i.custo)*i.qtd),v.pag,v.cliente||'',v.origem==='agua'?'Entrega de água':'Balcão'])})})}
  else{rows=[['Produto','Categoria','Qtd','Vendeu','Custo','Lucro','Margem %']];r.rank.forEach(function(a){rows.push([a.nome,a.cat,a.qtd,c(a.total),c(a.custo),c(a.lucro),c(a.total?a.lucro/a.total*100:0)])});
    rows.push([]);rows.push(['Faturamento','','',c(r.fat)]);rows.push(['Custo da mercadoria','','',c(r.cmv)]);rows.push(['Lucro bruto','','',c(r.bruto)]);rows.push(['Despesas','','',c(r.desp)]);rows.push(['Perdas','','',c(r.perd)]);rows.push(['Lucro líquido','','',c(r.liq)])}
  var txt='﻿'+rows.map(function(l){return l.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='sheik-adega-'+tipo+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('Planilha baixada','g')}
